[project]
name = "empatia-tipificaciones"
version = "0.1.0"
description = "Lambda handler that forwards call tipificaciones to the EmpatIA service"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=main --cov-report=term-missing --cov-fail-under=99"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 99
show_missing = true
